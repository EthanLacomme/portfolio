<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <title>Portfolio | Ethan Lacomme</title>
    <link rel="stylesheet" href="style.css?v=dev">
    <script src="projets-data.js?v=dev" defer></script>
    <script src="outils-data.js?v=dev" defer></script>
    <script src="experiences-data.js?v=dev" defer></script>
    <script src="translations.js?v=dev" defer></script>
    <!-- Vérifie les fichiers de données (seulement en local, invisible en ligne) -->
    <script src="verification.js?v=dev" defer></script>
    <script src="app.js?v=dev" defer></script>
    <!-- Description pour les moteurs de recherche -->
    <meta name="description" content="Portfolio d'Ethan Lacomme : projets de jeux vidéo, level design, expériences et compétences.">

    <!-- Aperçu affiché quand le lien est partagé (LinkedIn, Discord, mail...) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ethanlacomme.github.io/portfolio/">
    <meta property="og:title" content="Ethan Lacomme | Portfolio">
    <meta property="og:description" content="Projets de jeux vidéo, level design, expériences et compétences.">
    <meta property="og:image" content="https://ethanlacomme.github.io/portfolio/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:locale:alternate" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://ethanlacomme.github.io/portfolio/">
    <!-- Fiche "personne" lue par Google (nom, liens, domaines) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ethan Lacomme",
        "url": "https://ethanlacomme.github.io/portfolio/",
        "image": "https://ethanlacomme.github.io/portfolio/img/og-image.png",
        "sameAs": [
            "https://www.linkedin.com/in/ethanlacomme/",
            "https://github.com/Ethanific"
        ],
        "knowsAbout": [
            "Level design",
            "Game design",
            "Unreal Engine",
            "Unity",
            "Blender"
        ]
    }
    </script>
    <!-- Statistiques de visite GoatCounter (sans cookies ; les visites en local ne sont pas comptées) -->
    <script data-goatcounter="https://ethanlacomme.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
    
    <div id="site-header"></div>

    <main>
    <div class="section" id="accueil">
        <div class="content">
            <h2 data-i18n="accueil.titre"></h2>
            <p data-i18n="accueil.bienvenue"></p>
            <div class="accueil-actions">
                <a href="#projets" class="btn-plein" data-i18n="accueil.voirProjets"></a>
                <a href="documents/Ethan Lacomme CV General.pdf" target="_blank" class="btn" data-i18n="aPropos.cv"></a>
            </div>
        </div>
    </div>

    <div class="section" id="informations">
        <div class="content">
            <div>
                <h2 data-i18n="aPropos.titre"></h2>
                <p>
                    <span data-i18n="aPropos.ligne1"></span><span id="age">??</span><span data-i18n="aPropos.ans"></span>
                </p>
                <p data-i18n="aPropos.ligne2"></p>
                <p data-i18n="aPropos.ligne3"></p>
            </div>
        </div>
    </div>

    <div class="section" id="experiences">
        <div class="content">
            <h2 data-i18n="experiences.titre"></h2>
            <!-- Chargé dynamiquement depuis experiences-data.js -->
            <ol class="timeline" id="timeline"></ol>
            <div class="btn-box">
                <button id="experiencesBtn" onclick="toggleOldExperiences()" class="btn-plein" hidden></button>
            </div>
        </div>
    </div>

    <div class="section" id="outils">
        <div class="content">
            <h2 data-i18n="outils.titre"></h2>
            <p class="outils-intro" data-i18n="outils.intro"></p>
            <!-- Chargé dynamiquement depuis outils-data.js -->
            <div class="outils" id="liste-outils"></div>
        </div>
    </div>

    <div class="section" id="projets">
        
        <div class="content">
            <h2 data-i18n="projets.titre"></h2>
        </div>
        <!-- Filtres et affichage -->
        <div class="project-controls">
            <!-- Boutons créés automatiquement depuis CATEGORIES (projets-data.js) -->
            <div class="filtres" id="filtres" role="group"></div>
            <!-- Sous-tags du domaine choisi (cachés s'il n'y en a pas) -->
            <div class="filtres filtres--sous" id="sous-filtres" role="group" hidden></div>
            <!-- Filtre par outil actif (choisi dans "Mes outils" ou sur une carte) -->
            <div class="filtre-outil" id="filtre-outil" hidden></div>
        </div>

        <div class="grid-auto" id="all-projects">
            <!-- Chargé dynamiquement depuis projets-data.js -->
        </div>

        <!-- Bouton "Voir plus" -->
        <div class="btn-box" id="loadMoreContainer">
            <button id="loadMoreBtn" onclick="loadMore()" class="btn-plein" style="display: none;" data-i18n="projets.voirPlus"></button>
        </div>
    </div>

    <div class="section" id="contact">
        <div class="content">
            <h2 data-i18n="contact.titre"></h2>
            <div class="contentblock grid-auto">
                <div class="blocklist">
                    <img width="225" height="225" loading="lazy" src="img/reseaux_sociaux/Gmail.jpg" alt="Gmail Logo">
                    <!-- Adresse assemblée par app.js pour éviter les robots de spam -->
                    <p id="contact-email"></p>
                    <div class="contact-actions">
                        <a id="contact-mailto" class="btn" data-i18n="contact.ecrire"></a>
                        <button type="button" id="contact-copy" class="btn" onclick="copyEmail()" data-i18n="contact.copier"></button>
                    </div>
                </div>
                <div class="blocklist">
                    <img width="225" height="225" loading="lazy" src="img/reseaux_sociaux/LinkedIn.jpg" alt="LinkedIn Logo">
                    <a href="https://www.linkedin.com/in/ethanlacomme/" target="_blank">
                        <p data-i18n="contact.linkedIn"></p>
                    </a>
                </div>
                <div class="blocklist">
                    <img width="224" height="224" loading="lazy" src="img/reseaux_sociaux/GitHub.webp" alt="GitHub Logo">
                    <a href="https://github.com/Ethanific" target="_blank">
                        <p data-i18n="contact.githubPrincipal"></p>
                    </a>
                    <a href="https://github.com/EthanLacomme/portfolio" target="_blank">
                        <p data-i18n="contact.githubPortfolio"></p>
                    </a>
                </div>

            </div>
        </div>
    </div>
    </main>

    <!-- Bouton "retour en haut" (apparaît après avoir défilé) -->
    <button id="retourHaut" class="retour-haut" onclick="window.scrollTo({ top: 0 })" hidden>
        <span aria-hidden="true">↑</span>
        <span class="sr-only" data-i18n="nav.retourHaut"></span>
    </button>

    <div id="site-footer"></div>

</body>
</html>
